<!DOCTYPE html>
<html>
	<head>
		<title>Mora Jai Simulator</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="screen-container">
			<div class="settings">
				<label for="modeSelector">Mode: </label>
				<select name="modeSelector" id="modeSelector" autocomplete="off">
					<option value="Edit" selected>Edit mode</option>
					<option value="Solve">Solve mode</option>
				</select>
                <button id="reset">Reset</button>
			</div>
			<div class="box">
				<div class="tiles">
					<button class="tile corner grey-realm" id="top-left"></button>
					<div class="tile spacer"></div>
					<div class="tile spacer"></div>
					<div class="tile spacer"></div>
					<button class="tile corner grey-realm" id="top-right"></button>

					<div class="tile spacer"></div>
					<button class="tile main-tile grey-tile" id="tile-0"></button>
					<button class="tile main-tile grey-tile" id="tile-1"></button>
					<button class="tile main-tile grey-tile" id="tile-2"></button>
					<div class="tile spacer"></div>

					<div class="tile spacer"></div>
					<button class="tile main-tile grey-tile" id="tile-3"></button>
					<button class="tile main-tile grey-tile" id="tile-4"></button>
					<button class="tile main-tile grey-tile" id="tile-5"></button>
					<div class="tile spacer"></div>

					<div class="tile spacer"></div>
					<button class="tile main-tile grey-tile" id="tile-6"></button>
					<button class="tile main-tile grey-tile" id="tile-7"></button>
					<button class="tile main-tile grey-tile" id="tile-8"></button>
					<div class="tile spacer"></div>

					<button class="tile corner grey-realm" id="bottom-left"></button>
					<div class="tile spacer"></div>
					<div class="tile spacer"></div>
					<div class="tile spacer"></div>
					<button class="tile corner grey-realm" id="bottom-right"></button>
				</div>
			</div>
		</div>
		<dialog id="tile-select-modal">
			<h2>Select tile color</h2>
            <div id="tile-color-options">
                <button class="color-option grey-tile" id="grey">Grey</button>
                <button class="color-option white-tile" id="white">White</button>
                <button class="color-option black-tile" id="black">Black</button>
                <button class="color-option red-tile" id="red">Red</button>
                <button class="color-option yellow-tile" id="yellow">Yellow</button>
                <button class="color-option purple-tile" id="purple">Purple</button>
                <button class="color-option green-tile" id="green">Green</button>
                <button class="color-option pink-tile" id="pink">Pink</button>
                <button class="color-option orange-tile" id="orange">Orange</button>
                <button class="color-option blue-tile" id="blue">Blue</button>
            </div>
			<button id="closeModalBtn" class="close-btn">Close</button>
		</dialog>
	</body>
</html>

<script type="module" src="index.js"></script>
